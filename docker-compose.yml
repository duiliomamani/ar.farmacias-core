services:
  mongodb:
    image: mongo:latest
    container_name: farmaya-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    container_name: farmaya-redis
    ports:
      - "6379:6379"

volumes:
  mongodb_data:
